<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explainify.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section
      class="flex flex-col items-center gap-3 min-h-screen"
    >
      <h1 class="text-6xl font-bold text-slate-100 text-center mt-5">
        Decodify.ai
      </h1>
      <p class="text-[#94A3B8] mb-5 text-center">Turning Code into Clarity!</p>

      <!-- Search -->
      <div class="flex flex-row h-full w-full justify-center gap-3">
        <div  id="editor" class="p-8 rounded-3xl w-[80vw] h-[35vh] bg-[#1E293B] text-[#94A3B8] border border-[#475569]" >
        </div>

        <button id="search" class="text-[#64748B] hover:text-white">
          Search
        </button>
      </div>

      <!-- Feature Buttons -->
      <div class="flex flex-row gap-3 w-1/2 justify-center">
        <button id="flowchart"
          class="rounded-3xl w-1/2 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white"
        >
          Flowchart
        </button>
        <button id="timeComplexityBtn"
          class="rounded-3xl w-1/2 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white"
        >
          Time Complexity
        </button>
        <button id="spaceComplexityBtn"
          class="rounded-3xl w-1/2 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white"
        >
          Space Complexity
        </button>
        <button
          class="rounded-3xl w-1/2 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white"
        >
          Dry Run
        </button>
      </div>

      <!-- Result -->
     <div class="w-[80%] mt-8 text-[#E2E8F0] w-[80%] ">
  <p class="text-xl text-[#64748B] mb-2">Output</p>
  <div id="result" class="leading-relaxed text-base w-[80vw]">
  </div>
</div>

     <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
