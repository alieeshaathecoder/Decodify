<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decodify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="overflow-x-hidden">
    <section
      class="flex flex-col items-center gap-3 min-h-screen px-3 overflow-x-hidden"
    >
      <h1
        class="text-4xl md:text-6xl font-bold text-slate-100 text-center mt-5"
      >
        Decodify
      </h1>

      <p class="text-[#94A3B8] mb-5 text-center text-sm md:text-base">
        Turning Code into Clarity!
      </p>

      <!-- Search -->
      <div
        class="flex flex-col md:flex-row w-full max-w-[1200px] justify-center gap-3"
      >
        <div
          id="editor"
          class="p-4 md:p-8 rounded-3xl w-full h-[30vh] md:h-[35vh] bg-[#1E293B] text-[#94A3B8] border border-[#475569]"
        ></div>

        <button
          id="search"
          class="text-[#64748B] hover:text-white self-center md:self-auto whitespace-nowrap"
        >
          Search
        </button>
      </div>

      <!-- Feature Buttons -->
      <div
        class="flex flex-col md:flex-row gap-3 w-full max-w-[600px] justify-center"
      >
        <button
          id="flowchart"
          class="rounded-3xl w-full md:flex-1 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white text-sm truncate"
        >
          Flowchart
        </button>

        <button
          id="timeComplexityBtn"
          class="rounded-3xl w-full md:flex-1 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white text-sm truncate"
        >
          Time Complexity
        </button>

        <button
          id="spaceComplexityBtn"
          class="rounded-3xl w-full md:flex-1 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white text-sm truncate"
        >
          Space Complexity
        </button>

        <button
          id="dryRun"
          class="rounded-3xl w-full md:flex-1 h-8 bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white text-sm truncate"
        >
          Dry Run
        </button>
      </div>

      <!-- Output -->
      <div class="w-full max-w-[1100px] mt-5">
        <h2 class="text-[#64748B] text-sm md:text-xl mb-2 p-1 ">
          Output
        </h2>

        <div
          id="resultContainer"
          class="flex flex-col md:flex-row items-start gap-2"
        >
          <!-- Output Box -->
          <div
            id="result"
            class="flex-1 p-3 md:p-3 rounded-xl text-[#94A3B8] text-sm md:text-lg leading-relaxed break-words whitespace-pre-wrap overflow-y-auto max-h-[35vh] md:max-h-[27vh]"
          ></div>

          <!-- Button -->
          <button
            id="nextStep"
            class="px-4 py-2 rounded-full hidden bg-[#1E293B] text-[#94A3B8] hover:bg-[#15294c] hover:text-white self-end md:self-auto whitespace-nowrap"
          >
            Next Step
          </button>
        </div>
      </div>
    </section>
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
